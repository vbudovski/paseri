name: Lockfile check

on: workflow_call

permissions: {}

jobs:
  lockfile:
    name: Lockfile check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "^2.9.0"

      - name: Verify deno.lock matches the manifests
        run: |
          # Changing a member's deno.json range without regenerating the root workspace lock leaves
          # deno.lock stale. Dependabot does that when pointed at a member directory, which is why
          # dependabot.yml lists only "/". --frozen errors when the lock can't satisfy the manifests,
          # while staying quiet for a within-range upstream release the lock still satisfies.
          # --lockfile-only checks without installing packages.
          deno install --frozen --lockfile-only
